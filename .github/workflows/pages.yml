# Publishes the Steady site to GitHub Pages: the landing page (site/) at the root
# and the app (app/) under /app/. Runs when either changes on main, or by hand.
name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install, test and build the app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: Put the landing page at the root and the app under /app/
        run: |
          mkdir -p _site/app
          cp -R site/. _site/
          cp -R app/dist/. _site/app/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
